<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0B0315"
    >

    <meta
        name="description"
        content="FINORA — Invest • Grow • Earn"
    >

    <title>FINORA | Dashboard</title>

    <link
        rel="stylesheet"
        href="dashboard.css"
    >

</head>


<body>


<div class="dashboard-page">


    <!-- =========================================
         TOP HEADER
    ========================================== -->

    <header class="dashboard-header">

        <div class="dashboard-header-inner">


            <!-- HAMBURGER -->

            <button
                type="button"
                class="menu-button"
                id="menuButton"
                aria-label="Open menu"
            >

                <span></span>
                <span></span>
                <span></span>

            </button>



            <!-- CENTER FINORA BRAND -->

            <a
                href="dashboard.html"
                class="finora-brand"
            >

                <!-- REAL FINORA F MARK FROM INDEX.HTML -->

                <svg
                    class="finora-mark"
                    viewBox="0 0 100 110"
                    aria-hidden="true"
                >

                    <defs>

                        <linearGradient
                            id="finoraGold"
                            x1="0%"
                            y1="0%"
                            x2="100%"
                            y2="100%"
                        >

                            <stop
                                offset="0%"
                                stop-color="#FFD96A"
                            >

                            <stop
                                offset="50%"
                                stop-color="#F3B72F"
                            >

                            <stop
                                offset="100%"
                                stop-color="#B87912"
                            >

                        </linearGradient>


                        <linearGradient
                            id="finoraShine"
                            x1="0%"
                            y1="0%"
                            x2="100%"
                            y2="0%"
                        >

                            <stop
                                offset="0%"
                                stop-color="#FFF1A8"
                            >

                            <stop
                                offset="100%"
                                stop-color="#F3B72F"
                            >

                        </linearGradient>

                    </defs>


                    <path
                        class="finora-ribbon"
                        fill="url(#finoraGold)"
                        d="M18 8h64L68 28H31L18 8zm13 27h37L55 55H18l13-20zm-13 27h37L42 82H18l-13 20h37l37-57H45L18 62z"
                    />

                    <path
                        class="finora-highlight"
                        fill="url(#finoraShine)"
                        d="M18 8h64L68 28H31L18 8z"
                    />

                </svg>


                <div class="finora-brand-text">

                    <div class="finora-name">

                        <span>FIN</span><span>ORA</span>

                    </div>


                    <div class="finora-tagline">
                        INVEST • GROW • EARN
                    </div>

                </div>

            </a>



            <!-- RIGHT HEADER ACTIONS -->

            <div class="header-actions">


                <!-- NOTIFICATIONS -->

                <button
                    type="button"
                    class="header-action notification-button"
                    id="notificationButton"
                    aria-label="Notifications"
                >

                    <span class="notification-icon">
                        ♧
                    </span>

                    <span
                        class="notification-count"
                        id="notificationCount"
                    >
                        3
                    </span>

                </button>



                <!-- PROFILE -->

                <a
                    href="mine.html"
                    class="header-action profile-button"
                    aria-label="My profile"
                >

                    <span class="profile-icon">
                        ●
                    </span>

                </a>

            </div>

        </div>

    </header>



    <!-- =========================================
         DASHBOARD CONTENT
         
         NEXT HTML SECTION WILL GO HERE
    ========================================== -->

    <main class="dashboard-main" id="dashboardMain">
<!-- =========================================
     HAMBURGER MENU
========================================== -->

<div
    class="side-menu"
    id="sideMenu"
    aria-hidden="true"
>

    <div class="side-menu-header">

        <div class="side-menu-brand">

            <strong>FINORA</strong>

            <span>
                INVEST • GROW • EARN
            </span>

        </div>


        <button
            type="button"
            class="side-menu-close"
            id="sideMenuClose"
            aria-label="Close menu"
        >
            ×
        </button>

    </div>


    <div class="side-menu-content">


        <a href="help.html" class="side-menu-item">

            <span class="side-menu-item-icon">?</span>

            <span class="side-menu-item-text">

                <strong>Help & FAQ</strong>

                <small>
                    Get answers and support
                </small>

            </span>

        </a>


        <a href="about.html" class="side-menu-item">

            <span class="side-menu-item-icon">i</span>

            <span class="side-menu-item-text">

                <strong>About FINORA</strong>

                <small>
                    Learn about our platform
                </small>

            </span>

        </a>


        <a href="terms.html" class="side-menu-item">

            <span class="side-menu-item-icon">✓</span>

            <span class="side-menu-item-text">

                <strong>Terms & Conditions</strong>

                <small>
                    Platform terms
                </small>

            </span>

        </a>


        <a href="privacy.html" class="side-menu-item">

            <span class="side-menu-item-icon">◇</span>

            <span class="side-menu-item-text">

                <strong>Privacy Policy</strong>

                <small>
                    Your privacy matters
                </small>

            </span>

        </a>


        <a href="contact.html" class="side-menu-item">

            <span class="side-menu-item-icon">✉</span>

            <span class="side-menu-item-text">

                <strong>Contact Us</strong>

                <small>
                    Reach the FINORA team
                </small>

            </span>

        </a>


        <a href="settings.html" class="side-menu-item">

            <span class="side-menu-item-icon">⚙</span>

            <span class="side-menu-item-text">

                <strong>Settings</strong>

                <small>
                    Manage your account
                </small>

            </span>

        </a>


        <button
            type="button"
            class="side-menu-item logout-item"
            id="logoutButton"
        >

            <span class="side-menu-item-icon">↪</span>

            <span class="side-menu-item-text">

                <strong>Log Out</strong>

                <small>
                    Sign out of your account
                </small>

            </span>

        </button>


    </div>

</div>


<!-- MENU BACKDROP -->

<div
    class="menu-backdrop"
    id="menuBackdrop"
></div>
    </main>


</div>


</body>

</html>
