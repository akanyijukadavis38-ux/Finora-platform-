<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#07050A">

    <meta
        name="description"
        content="FINORA — My Profile">

    <title>FINORA | My Profile</title>

    <link
        rel="stylesheet"
        href="profile.css">

</head>


<body>

<div class="profile-page">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="profile-header">

        <a
            href="dashboard.html"
            class="profile-brand"
            aria-label="FINORA Dashboard">


            <!-- FINORA F LOGO -->

            <svg
                class="profile-logo"
                viewBox="0 0 100 110"
                xmlns="http://www.w3.org/2000/svg"
                aria-label="FINORA logo"
                role="img">

                <defs>

                    <linearGradient
                        id="profileGold"
                        x1="12"
                        y1="5"
                        x2="88"
                        y2="105"
                        gradientUnits="userSpaceOnUse">

                        <stop
                            offset="0"
                            stop-color="#FFF0A8"/>

                        <stop
                            offset=".22"
                            stop-color="#FFD35A"/>

                        <stop
                            offset=".55"
                            stop-color="#F2B52F"/>

                        <stop
                            offset=".82"
                            stop-color="#D88A12"/>

                        <stop
                            offset="1"
                            stop-color="#A95E05"/>

                    </linearGradient>


                    <linearGradient
                        id="profileShine"
                        x1="20"
                        y1="4"
                        x2="55"
                        y2="70"
                        gradientUnits="userSpaceOnUse">

                        <stop
                            offset="0"
                            stop-color="#FFF8D0"/>

                        <stop
                            offset=".45"
                            stop-color="#FFE27A"/>

                        <stop
                            offset="1"
                            stop-color="#E9A51E"/>

                    </linearGradient>

                </defs>


                <path
                    fill="url(#profileGold)"
                    d="
                    M20 8
                    C21 5 24 3 28 3
                    H82
                    C85 3 87 5 85 8
                    L78 19
                    C77 21 75 22 72 22
                    H46
                    C39 22 34 24 29 27
                    C25 30 22 33 20 37
                    L15 49
                    C14 52 16 54 19 52
                    L28 46
                    C33 42 39 40 45 40
                    H67
                    C70 40 72 42 70 45
                    L63 56
                    C62 58 60 59 57 59
                    H46
                    C40 59 36 62 33 67
                    C30 72 27 80 24 88
                    L20 101
                    H5
                    L18 56
                    C20 49 23 42 27 37
                    C32 30 39 27 47 26
                    H72
                    L77 18
                    H43
                    C34 18 27 21 21 27
                    L16 32
                    Z
                    " />

                <path
                    fill="url(#profileShine)"
                    opacity=".72"
                    d="
                    M27 7
                    H79
                    L75 13
                    H45
                    C36 13 29 16 23 21
                    L20 23
                    L24 10
                    C24 8 25 7 27 7
                    Z
                    " />

            </svg>


            <!-- FINORA WORDMARK -->

            <div class="profile-brand-text">

                <div class="profile-finora-name">

                    <span class="profile-fin">
                        FIN
                    </span>

                    <span class="profile-ora">
                        ORA
                    </span>

                </div>

                <div class="profile-tagline">
                    INVEST • GROW • EARN
                </div>

            </div>

        </a>


        <!-- BACK TO DASHBOARD -->

        <a
            href="dashboard.html"
            class="profile-back">

            ← Dashboard

        </a>

    </header>



    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main class="profile-main">

        <div class="profile-container">


            <!-- =================================================
                 PAGE HEADING
                 ================================================= -->

            <section class="profile-heading">

                <div class="profile-kicker">
                    ACCOUNT
                </div>

                <h1>
                    My Profile
                </h1>

                <p>
                    Manage your FINORA account information.
                </p>

            </section>



            <!-- =================================================
                 PROFILE SUMMARY
                 ================================================= -->

            <section class="profile-summary">


                <div class="profile-avatar">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg">

                        <circle
                            cx="12"
                            cy="8"
                            r="4"
                            fill="currentColor"/>

                        <path
                            d="
                            M4 21
                            C4 16.582
                            7.582 13
                            12 13
                            C16.418 13
                            20 16.582
                            20 21"
                            fill="currentColor"/>

                    </svg>

                </div>


                <div class="profile-user">

                    <!-- ONLY FULL NAME -->

                    <h2 id="profileFullName">
                        Investor
                    </h2>

                    <p id="profileEmail">
                        —
                    </p>

                </div>


                <span
                    class="profile-status"
                    id="profileStatus">

                    Active

                </span>

            </section>



            <!-- =================================================
                 ACCOUNT INFORMATION
                 ================================================= -->

            <section class="account-information">


                <div class="information-heading">

                    <div class="profile-kicker">
                        ACCOUNT INFORMATION
                    </div>

                    <h2>
                        Personal Details
                    </h2>

                </div>



                <div class="information-list">


                    <!-- FULL NAME -->

                    <div class="information-row">

                        <span>
                            Full Name
                        </span>

                        <strong id="accountFullName">
                            —
                        </strong>

                    </div>



                    <!-- PHONE NUMBER -->

                    <div class="information-row">

                        <span>
                            Phone Number
                        </span>

                        <strong id="profilePhone">
                            —
                        </strong>

                    </div>



                    <!-- EMAIL ADDRESS -->

                    <div class="information-row">

                        <span>
                            Email Address
                        </span>

                        <strong id="profileEmailAddress">
                            —
                        </strong>

                    </div>



                    <!-- ACCOUNT NUMBER -->

                    <div class="information-row">

                        <span>
                            Account Number
                        </span>

                        <strong id="profileAccountNumber">
                            —
                        </strong>

                    </div>


                </div>

            </section>


        </div>

    </main>



    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="profile-footer">

        <p>

            FINORA 2026

            <span>•</span>

            Invest

            <span>•</span>

            Grow

            <span>•</span>

            Earn

        </p>

    </footer>


</div>



<!-- =====================================================
     PROFILE JAVASCRIPT
     ===================================================== -->

<script src="profile.js"></script>

</body>

</html>
