<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#0B0A0F">

    <meta
        name="description"
        content="FINORA — Change Password">

    <title>FINORA | Change Password</title>

    <style>

        :root {
            --bg: #0B0A0F;
            --card: #111016;
            --white: #FFFFFF;
            --muted: #9B96A3;
            --gold: #D9A441;
            --gold-light: #F1C75B;
            --magenta: #D100FF;
            --pink: #FF2FAE;
            --border: rgba(255,255,255,.07);
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--white);
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        body {
            min-height: 100vh;
        }


        .page {
            min-height: 100vh;
            padding-bottom: 30px;
        }


        .container {
            width: min(
                100% - 30px,
                520px
            );

            margin: 0 auto;
        }


        /* =================================================
           HEADER
        ================================================= */

        .header {
            padding: 18px 0 22px;
        }


        .top-header {
            position: relative;

            min-height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .back-button {
            position: absolute;
            left: 0;

            width: 42px;
            height: 42px;

            padding: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid
                rgba(209, 0, 255, .22);

            border-radius: 50%;

            background:
                rgba(7, 6, 9, .72);

            color: var(--white);

            cursor: pointer;
        }


        .back-button svg {
            width: 21px;
            height: 21px;
        }


        /* =================================================
           FINORA BRAND
        ================================================= */

        .brand {
            text-align: center;
            text-decoration: none;
        }


        .brand-name {
            font-family:
                "Times New Roman",
                Times,
                serif;

            font-size: 35px;

            font-weight: 700;

            letter-spacing: -2px;

            line-height: 1;
        }


        .brand-fin {
            color: var(--white);
        }


        .brand-ora {
            color: var(--gold-light);
        }


        .brand-tagline {
            margin-top: 6px;

            color: var(--magenta);

            font-size: 8px;

            font-weight: 800;

            letter-spacing: 1.8px;

            line-height: 1;
        }


        /* =================================================
           MAIN
        ================================================= */

        .main {
            padding-top: 18px;
        }


        .kicker {
            color: var(--pink);

            font-size: 9px;

            font-weight: 800;

            letter-spacing: 2px;
        }


        h1 {
            margin: 7px 0 8px;

            font-family:
                "Times New Roman",
                Times,
                serif;

            font-size: 30px;

            line-height: 1.15;
        }


        h1 span {
            color: var(--gold-light);
        }


        .intro {
            margin: 0 0 28px;

            color: var(--muted);

            font-size: 12px;

            line-height: 1.6;
        }


        /* =================================================
           CARD
        ================================================= */

        .card {
            padding: 22px 18px;

            border: 1px solid var(--border);

            border-radius: 16px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.035),
                    rgba(255,255,255,.012)
                );

            box-shadow:
                0 18px 40px
                rgba(0,0,0,.25);
        }


        .field {
            margin-bottom: 18px;
        }


        .field label {
            display: block;

            margin-bottom: 8px;

            color: var(--white);

            font-size: 11px;

            font-weight: 700;
        }


        .password-wrap {
            position: relative;
        }


        .password-input {
            width: 100%;

            height: 48px;

            padding:
                0 48px 0 14px;

            border: 1px solid
                rgba(255,255,255,.09);

            border-radius: 10px;

            outline: none;

            background:
                rgba(0,0,0,.24);

            color: var(--white);

            font-size: 13px;

            transition:
                border-color .2s ease,
                box-shadow .2s ease;
        }


        .password-input:focus {
            border-color:
                rgba(209,0,255,.55);

            box-shadow:
                0 0 0 3px
                rgba(209,0,255,.08);
        }


        .password-input::placeholder {
            color: #625E68;
        }


        .toggle-password {
            position: absolute;

            top: 50%;
            right: 8px;

            width: 36px;
            height: 36px;

            transform:
                translateY(-50%);

            display: flex;
            align-items: center;
            justify-content: center;

            border: 0;

            background: transparent;

            color: var(--muted);

            cursor: pointer;
        }


        .toggle-password svg {
            width: 19px;
            height: 19px;
        }


        /* =================================================
           MESSAGE
        ================================================= */

        .message {
            display: none;

            margin:
                4px 0 18px;

            padding: 11px 12px;

            border-radius: 9px;

            font-size: 11px;

            line-height: 1.5;
        }


        .message.show {
            display: block;
        }


        .message.error {
            border: 1px solid
                rgba(255,70,110,.25);

            background:
                rgba(255,70,110,.07);

            color: #FF8EA8;
        }


        .message.success {
            border: 1px solid
                rgba(80,220,150,.25);

            background:
                rgba(80,220,150,.07);

            color: #7DE5B0;
        }


        /* =================================================
           BUTTON
        ================================================= */

        .submit-button {
            width: 100%;

            height: 48px;

            border: 0;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    var(--magenta),
                    var(--pink)
                );

            color: var(--white);

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 1.3px;

            cursor: pointer;

            box-shadow:
                0 10px 25px
                rgba(209,0,255,.18);
        }


        .submit-button:disabled {
            opacity: .6;

            cursor: not-allowed;
        }


        /* =================================================
           FOOTER
        ================================================= */

        .site-footer {
            margin-top: 34px;

            padding:
                28px 15px 24px;

            border-top:
                1px solid
                rgba(255,255,255,.055);

            text-align: center;
        }


        .footer-brand {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 0;

            font-family:
                "Times New Roman",
                Times,
                serif;

            font-size: 35px;

            font-weight: 700;

            letter-spacing: -2px;

            line-height: 1;
        }


        .footer-brand .fin,
        .footer-brand .ora {
            display: inline;

            margin: 0;
            padding: 0;

            letter-spacing: -2px;
        }


        .footer-brand .fin {
            color: var(--white);
        }


        .footer-brand .ora {
            color: var(--gold-light);
        }


        .footer-tagline {
            margin-top: 6px;

            color: var(--pink);

            font-size: 8px;

            font-weight: 800;

            letter-spacing: 1.8px;

            line-height: 1;
        }


        .footer-text {
            max-width: 320px;

            margin:
                12px auto 0;

            color: var(--muted);

            font-size: 9px;

            line-height: 1.6;
        }


        .footer-copy {
            margin-top: 10px;

            color: var(--muted);

            font-size: 9px;
        }

    </style>

</head>


<body>

<div class="page">


    <header class="header">

        <div class="container top-header">

            <button
                type="button"
                class="back-button"
                id="backButton"
                aria-label="Go back">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <path d="m15 18-6-6 6-6"></path>

                </svg>

            </button>


            <a
                href="dashboard.html"
                class="brand"
                aria-label="FINORA Home">

                <div class="brand-name">

                    <span class="brand-fin">FIN</span><span class="brand-ora">ORA</span>

                </div>

                <div class="brand-tagline">
                    INVEST • GROW • EARN
                </div>

            </a>

        </div>

    </header>



    <main class="container main">

        <div class="kicker">
            SECURITY
        </div>

        <h1>
            Change <span>Password</span>
        </h1>

        <p class="intro">
            Update your FINORA account password securely.
        </p>


        <section class="card">

            <form id="changePasswordForm">


                <div class="field">

                    <label for="currentPassword">
                        Current Password
                    </label>

                    <div class="password-wrap">

                        <input
                            type="password"
                            id="currentPassword"
                            class="password-input"
                            autocomplete="current-password"
                            placeholder="Enter your current password"
                            required>

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="currentPassword"
                            aria-label="Show current password">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linecap="round"
                                stroke-linejoin="round">

                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="2.5">
                                </circle>

                            </svg>

                        </button>

                    </div>

                </div>



                <div class="field">

                    <label for="newPassword">
                        New Password
                    </label>

                    <div class="password-wrap">

                        <input
                            type="password"
                            id="newPassword"
                            class="password-input"
                            autocomplete="new-password"
                            placeholder="Enter your new password"
                            minlength="6"
                            required>

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="newPassword"
                            aria-label="Show new password">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linecap="round"
                                stroke-linejoin="round">

                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="2.5">
                                </circle>

                            </svg>

                        </button>

                    </div>

                </div>



                <div class="field">

                    <label for="confirmPassword">
                        Confirm New Password
                    </label>

                    <div class="password-wrap">

                        <input
                            type="password"
                            id="confirmPassword"
                            class="password-input"
                            autocomplete="new-password"
                            placeholder="Confirm your new password"
                            minlength="6"
                            required>

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="confirmPassword"
                            aria-label="Show confirmation password">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linecap="round"
                                stroke-linejoin="round">

                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="2.5">
                                </circle>

                            </svg>

                        </button>

                    </div>

                </div>


                <div
                    class="message"
                    id="message"
                    role="alert">
                </div>


                <button
                    type="submit"
                    class="submit-button"
                    id="submitButton">

                    CHANGE PASSWORD

                </button>


            </form>

        </section>

    </main>



    <footer class="site-footer">

        <div class="container">

            <div class="footer-brand">
                <span class="fin">FIN</span><span class="ora">ORA</span>
            </div>

            <div class="footer-tagline">
                INVEST • GROW • EARN
            </div>

            <p class="footer-text">
                FINORA provides a simple and transparent
                investment experience designed around
                clear earning structures.
            </p>

            <div class="footer-copy">
                © 2026 FINORA. All rights reserved.
            </div>

        </div>

    </footer>


</div>


<script>

const FINORA_API =
    "https://finora-platform-production.up.railway.app";


/* =========================================================
   BACK
========================================================= */

document
    .getElementById("backButton")
    .addEventListener(
        "click",
        () => {

            if (
                window.history.length > 1
            ) {

                window.history.back();

            } else {

                window.location.href =
                    "profile.html";

            }

        }
    );


/* =========================================================
   PASSWORD TOGGLES
========================================================= */

document
    .querySelectorAll(".toggle-password")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const target =
                    document.getElementById(
                        button.dataset.target
                    );


                if (!target) {
                    return;
                }


                const showing =
                    target.type === "text";


                target.type =
                    showing
                        ? "password"
                        : "text";


                button.setAttribute(
                    "aria-label",
                    showing
                        ? "Show password"
                        : "Hide password"
                );

            }
        );

    });


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        `message show ${type}`;

}


/* =========================================================
   CHANGE PASSWORD
========================================================= */

document
    .getElementById("changePasswordForm")
    .addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const currentPassword =
                document.getElementById(
                    "currentPassword"
                ).value;


            const newPassword =
                document.getElementById(
                    "newPassword"
                ).value;


            const confirmPassword =
                document.getElementById(
                    "confirmPassword"
                ).value;


            const submitButton =
                document.getElementById(
                    "submitButton"
                );


            /* =============================================
               FRONTEND VALIDATION
            ============================================= */

            if (
                newPassword.length < 6
            ) {

                showMessage(
                    "New password must be at least 6 characters.",
                    "error"
                );

                return;

            }


            if (
                newPassword !==
                confirmPassword
            ) {

                showMessage(
                    "New passwords do not match.",
                    "error"
                );

                return;

            }


            if (
                newPassword ===
                currentPassword
            ) {

                showMessage(
                    "New password must be different from your current password.",
                    "error"
                );

                return;

            }


            /* =============================================
               SUBMIT
            ============================================= */

            submitButton.disabled =
                true;

            submitButton.textContent =
                "CHANGING PASSWORD...";


            showMessage(
                "",
                "success"
            );


            try {

                const response =
                    await fetch(
                        `${FINORA_API}/api/users/change-password`,
                        {
                            method: "POST",

                            credentials: "include",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Accept":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    currentPassword,
                                    newPassword,
                                    confirmPassword
                                })
                        }
                    );


                const data =
                    await response
                        .json()
                        .catch(
                            () => ({})
                        );


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "FINORA could not change your password."
                    );

                }


                showMessage(
                    data.message ||
                    "FINORA password changed successfully.",
                    "success"
                );


                document
                    .getElementById(
                        "changePasswordForm"
                    )
                    .reset();


                setTimeout(
                    () => {

                        window.location.href =
                            "profile.html";

                    },
                    1600
                );


            } catch (error) {

                console.error(
                    "❌ FINORA CHANGE PASSWORD ERROR:",
                    error
                );


                showMessage(
                    error.message ||
                    "FINORA could not change your password right now.",
                    "error"
                );


                submitButton.disabled =
                    false;

                submitButton.textContent =
                    "CHANGE PASSWORD";

            }

        }
    );

</script>

</body>
</html>
